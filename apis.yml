name: GetGlue
description: GetGlue was a social-entertainment "check-in" network where users checked in to TV shows,
  movies, sports, music, and books to earn stickers and badges and see what friends were watching. Founded
  by Alex Iskold and backed by Union Square Ventures, it offered a public API and social graph for
  entertainment. GetGlue was acquired by i.TV in late 2013, rebranded to tvtag, and the service was
  discontinued. The getglue.com domain is now a parked lander with no live product, developer portal, or
  API surface. This profile is retained in the API Evangelist network as a historical portfolio lead.
